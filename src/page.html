<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הבית שלנו</title>
<style>
  :root { color-scheme: light; --accent: #ff7a00; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cce4fc; font-family: Arial, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas, #app .snap { display: block; width: 100%; height: 100%; }
  #app .snap { position: absolute; inset: 0; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-size: 22px; color: #1d2b36; background: #eef3f6; z-index: 50; }
  #loading .spin { width: 24px; height: 24px; border: 7px solid #d6e2ea; border-top-color: #5aa7f0; border-radius: 50%; animation: spin 1.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lil-gui.root { direction: rtl; --width: 200px; }
  .lil-gui .controller { direction: rtl; }
  /* the layer check-boxes sit in two columns */
  .lil-gui.two-col > .children { display: grid; grid-template-columns: 1fr 1fr; }
  .lil-gui.two-col .controller { --name-width: 74%; }
  /* floor colours: a round radio button and the colour behind its label only */
  .lil-gui .controller.radio { justify-content: flex-start; gap: 6px; height: auto; min-height: 28px; padding: 2px 6px; }
  .lil-gui .controller.radio .name { flex: 0 0 auto; width: auto; color: #222; padding: 1px 7px; border-radius: 5px; white-space: pre-line; line-height: 1.25; }
  .lil-gui .controller.radio .widget { width: auto; flex: 0 0 auto; }
  .lil-gui .controller.radio input { border-radius: 50%; }
  /* floor colours: the right column hugs the right side of the menu, the left one the left side, with the same margin */
  .lil-gui.radio-folder > .children > .controller.radio:nth-child(even) { justify-content: flex-end; }
  .info-box { position: fixed; left: 12px; bottom: 12px; background: #ffffffee; color: #1b1b1b; border: 1px solid #d0d4d8;
    border-radius: 10px; padding: 10px 14px; font-size: 14px; box-shadow: 0 2px 10px #0002; z-index: 20; }
  .info-box table { border-collapse: collapse; margin: 6px 0 2px; }
  .info-box td { padding: 1px 8px 1px 0; }
  .info-box td:last-child { font-weight: bold; text-align: left; direction: ltr; }
  .info-box small { color: #555; }
  .walk-hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1d2b36e6; color: #fff;
    padding: 8px 16px; border-radius: 20px; font-size: 15px; z-index: 30; white-space: nowrap; }
  .walk-hint button { font: inherit; font-size: 14px; margin-inline-start: 8px; padding: 2px 10px; border-radius: 12px; border: 0; background: #fff; color: #1d2b36; cursor: pointer; }
  .walk-height { position: fixed; left: 14px; top: 14px; z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: #1d2b36e6; color: #fff; padding: 10px 8px; border-radius: 14px; font-size: 13px; user-select: none; }
  .walk-height[hidden] { display: none; }
  /* the title folds the box, like the title of the main menu */
  .walk-height > :first-child { cursor: pointer; font-weight: 600; }
  .walk-height > :first-child::before { font-family: "lil-gui"; content: "\25BE"; padding-right: 2px; display: inline-block; } /* the arrow of the main menu title */
  .walk-height.collapsed > :not(:first-child) { display: none; }
  .walk-height.collapsed { padding-bottom: 8px; }
  .walk-height.collapsed > :first-child::before { content: "\25B8"; }
  .walk-height input { writing-mode: vertical-lr; direction: rtl; height: 180px; width: 28px; margin: 0; touch-action: none; }
  .plan-view { position: fixed; inset: 0; background: #fff; z-index: 10; display: flex; flex-direction: column; }
  .plan-view[hidden] { display: none; }
  .plan-bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: #f3f5f7; border-bottom: 1px solid #d6dbe0; flex-wrap: wrap; padding-right: 220px; }
  .plan-bar button { font: inherit; font-size: 14px; padding: 5px 10px; border: 1px solid #b9c1c8; border-radius: 6px; background: #fff; color: #1b1b1b; cursor: pointer; }
  .plan-bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .plan-hint { font-size: 13px; color: #444; }
  .plan-view canvas { flex: 1; width: 100%; min-height: 0; touch-action: none; }
  @media (max-width: 700px) { .plan-bar { padding-right: 10px; } .lil-gui.root { --width: 200px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading"><div class="spin"></div><div>טוען את הבית…</div></div>
<!-- the big data blocks come after the loading screen so it can paint first -->
<script id="house-data" type="application/json">__HOUSE__</script>
<script id="items-data" type="application/json">__ITEMS__</script>
<script id="assets-data" type="application/json">__ASSETS__</script>
<script>__BUNDLE__</script>
</body>
</html>
