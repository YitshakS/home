<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הבית שלנו</title>
<style>
  :root { color-scheme: light; --accent: #ff7a00; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cce4fc; font-family: Arial, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas, #app .snap { display: block; width: 100%; height: 100%; }
  #app .snap { position: absolute; inset: 0; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; color: #1d2b36; background: #eef3f6; z-index: 50; }
  .lil-gui.root { direction: rtl; --width: 300px; }
  .lil-gui .controller { direction: rtl; }
  .info-box { position: fixed; left: 12px; bottom: 12px; background: #ffffffee; color: #1b1b1b; border: 1px solid #d0d4d8;
    border-radius: 10px; padding: 10px 14px; font-size: 14px; min-width: 170px; box-shadow: 0 2px 10px #0002; z-index: 20; }
  .info-box table { border-collapse: collapse; margin: 6px 0 2px; }
  .info-box td { padding: 1px 8px 1px 0; }
  .info-box td:last-child { font-weight: bold; text-align: left; direction: ltr; }
  .info-box small { color: #555; }
  .plan-view { position: fixed; inset: 0; background: #fff; z-index: 10; display: flex; flex-direction: column; }
  .plan-view[hidden] { display: none; }
  .plan-bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: #f3f5f7; border-bottom: 1px solid #d6dbe0; flex-wrap: wrap; padding-right: 320px; }
  .plan-bar button { font: inherit; font-size: 14px; padding: 5px 10px; border: 1px solid #b9c1c8; border-radius: 6px; background: #fff; color: #1b1b1b; cursor: pointer; }
  .plan-bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .plan-hint { font-size: 13px; color: #444; }
  .plan-view canvas { flex: 1; width: 100%; min-height: 0; touch-action: none; }
  @media (max-width: 700px) { .plan-bar { padding-right: 10px; } .lil-gui.root { --width: 240px; } }
</style>
<script id="house-data" type="application/json">__HOUSE__</script>
<script id="items-data" type="application/json">__ITEMS__</script>
<script id="assets-data" type="application/json">__ASSETS__</script>
</head>
<body>
<div id="app"></div>
<div id="loading">טוען את הבית…</div>
<script>__BUNDLE__</script>
</body>
</html>
